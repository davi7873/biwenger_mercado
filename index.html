<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Muvins Biwenger</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F5C3E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Muvins" />

<script>
// Recuadro de error visible: muestra mensaje, archivo y linea si algo falla.
function mostrarError(texto) {
  var d = document.createElement("div");
  d.className = "fatal-box";
  d.textContent = texto;
  d.onclick = function () { d.remove(); };
  document.body.appendChild(d);
}
window.addEventListener("error", function (e) {
  mostrarError("Error: " + e.message + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ")");
});
window.addEventListener("unhandledrejection", function (e) {
  mostrarError("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<link rel="stylesheet" href="estilos.css?v=3" />
<body>

<div class="masthead">
  <div class="masthead-left">
    <img src="icon-192.png" alt="" class="app-logo" />
    <div>
      <div class="title-row">
        <h1 class="font-display">MUVINS BIWENGER</h1>
        <button class="info-btn" onclick="toggleInfoModal()" aria-label="Informacion">i</button>
      </div>
      <p id="last-updated"></p>
    </div>
  </div>
  <button class="stats-btn" onclick="openStats()" aria-label="Estadisticas">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </svg>
  </button>
</div>

<div id="info-modal" class="modal-backdrop" style="display:none;" onclick="closeInfoIfBackdrop(event)">
  <div class="modal-box">
    <p>Compras y clausulas por semana. Pulsa un manager para ver su detalle.</p>
    <p id="app-version" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-muted);margin-bottom:12px;"></p>
    <button class="modal-close" onclick="toggleInfoModal()">Cerrar</button>
  </div>
</div>

<div id="ticker-wrap" class="ticker-wrap" style="display:none;">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<div class="app-root" id="app-root">
  <div id="pull-indicator" class="pull-indicator"></div>
  <div id="app-content">
    <div class="loading">Cargando datos del mercado...</div>
  </div>
</div>

<div class="nav-wrap" id="nav-wrap" style="display:none;"></div>


<script src="app-base.js?v=3"></script>
<script src="app-stats.js?v=3"></script>
<script src="app-extra.js?v=3"></script>
<script>
window.addEventListener("load", function () {
  var faltan = ["app-base.js", "app-stats.js", "app-extra.js"].filter(function (f) {
    return (window.__cargados || []).indexOf(f) === -1;
  });
  if (faltan.length) {
    mostrarError("No se cargaron enteros: " + faltan.join(", ") + ". Vuelve a subirlos a GitHub y recarga.");
  }
});
</script>
</body>
</html>
