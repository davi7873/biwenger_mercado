<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Muvins Biwenger</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1F5C3E" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Muvins" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --bg: #F5F7F4;
    --surface: #FFFFFF;
    --border: #DCE6DE;
    --ink: #16281D;
    --ink-muted: #5B7266;
    --pitch: #1F5C3E;
    --pitch-light: #2E8B57;
    --gold: #E3A72E;
    --gold-bg: #FBF0DA;
    --gold-text: #7A4E0C;
    --rose: #C4453B;
    --rose-bg: #FBEAE8;
    --rose-text: #7E2C25;
    --green-bg: #E6F3EB;
    --green-text: #155C36;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }
  .font-display { font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 700; }
  .font-mono { font-family: 'JetBrains Mono', monospace; }

  .masthead {
    background: var(--pitch);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .masthead-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .app-logo { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; display: block; }
  .title-row { display: flex; align-items: center; gap: 8px; }
  .masthead h1 { color: #fff; font-size: 20px; margin: 0; letter-spacing: 0.5px; }
  .masthead p { color: #BFE0CC; font-size: 12px; margin: 4px 0 0; }
  .info-btn {
    width: 20px; height: 20px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.55); background: transparent; color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0;
  }
  .info-btn:hover { background: rgba(255,255,255,0.15); }
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10,20,15,0.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 50; padding: 20px;
  }
  .modal-box {
    background: var(--surface); border-radius: 14px; padding: 20px;
    max-width: 320px; box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  }
  .modal-box p { margin: 0 0 16px; color: var(--ink); font-size: 14px; line-height: 1.5; }
  .modal-close {
    background: var(--pitch); color: #fff; border: none; border-radius: 8px;
    padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%;
  }
  .stats-btn {
    width: 38px; height: 38px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.1); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .stats-btn:hover { background: rgba(255,255,255,0.22); }

  .ticker-wrap {
    background: #0F2E1E;
    overflow: hidden;
    padding: 8px 0;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .ticker-track {
    display: inline-flex;
    animation: scroll 40s linear infinite;
  }
  @keyframes scroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-item {
    padding: 0 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: #DDEFE3;
    display: inline-flex;
    gap: 8px;
    align-items: center;
  }
  .ticker-item b { color: var(--gold); }
  .ticker-item strong { color: #fff; }

  .nav-wrap {
    background: #0F2E1E;
    padding: 0 16px 0 0;
    padding-bottom: env(safe-area-inset-bottom, 0);
    display: flex;
    gap: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    flex-shrink: 0;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
  }
  .nav-tab {
    background: none; border: none; cursor: pointer; white-space: nowrap;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 13px;
    color: #EAF2ED; padding: 25px 14px; border-top: 2px solid transparent;
  }
  .nav-tab.active { color: var(--gold); border-top-color: var(--gold); }
  .nav-tab:hover:not(.active) { color: #fff; }
  .nav-tab-resumen {
    color: var(--gold) !important;
    position: sticky;
    left: 0;
    background: #0F2E1E;
    z-index: 3;
    padding-left: 16px;
    padding-right: 18px;
    margin-right: 4px;
    box-shadow: 2px 0 0 rgba(227,167,46,0.4);
  }

  .app-root {
    flex: 1;
    min-height: 0;
    min-width: 0;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }
  .pull-indicator {
    height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-align: center;
    transition: height 0.15s ease;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px; min-width: 0; overflow-x: auto; }
  .hint { color: var(--ink-muted); font-size: 14px; margin-bottom: 16px; }

  table { width: 100%; min-width: 420px; border-collapse: collapse; background: var(--surface); }
  th, td { padding: 12px 16px; text-align: center; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  thead th { border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); z-index: 2; }
  thead th:first-child { z-index: 3; }
  tbody tr:not(:first-child) td { border-top: 1px solid var(--border); }

  @media (max-width: 640px) {
    .masthead { padding: 12px 16px; flex-wrap: wrap; gap: 8px; }
    .masthead h1 { font-size: 16px; }
    .masthead p { font-size: 11px; }
    .stats-btn { width: 32px; height: 32px; }
    .container { padding: 14px; }
    .hint { font-size: 12px; }
    .ticker-item { font-size: 11px; padding: 0 14px; }
    th, td { padding: 10px 12px; font-size: 13px; }
    th:first-child, td:first-child {
      white-space: normal;
      width: 72px;
      max-width: 72px;
      min-width: 72px;
      font-size: 10px;
      line-height: 1.25;
      padding-left: 8px;
      padding-right: 6px;
    }
    .dossier-title { font-size: 20px; }
    .card { flex-wrap: wrap; padding: 12px; }
    .card-date { width: auto; }
  }
  .user-link {
    background: none; border: none; cursor: pointer;
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 14px;
    color: var(--pitch);
  }
  .user-link:hover { text-decoration: underline; }
  .count-pill {
    display: inline-flex; align-items: center; justify-content: center;
    width: 28px; height: 28px; border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600;
  }

  .back-btn {
    background: none; border: none; cursor: pointer;
    color: var(--ink-muted); font-size: 14px; font-weight: 500;
    display: flex; align-items: center; gap: 6px; margin-bottom: 16px;
  }
  .dossier-title { font-size: 26px; margin: 0 0 4px; }
  .dossier-sub { color: var(--ink-muted); font-size: 14px; margin: 0 0 24px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 8px;
  }
  .card-left { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .card-date { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink-muted); width: 110px; flex-shrink: 0; }
  .card-player { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 16px; margin: 0; }
  .card-vendor { font-size: 12px; color: var(--ink-muted); margin: 2px 0 0; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    flex-shrink: 0;
  }

  .stats-tabs {
    display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    margin-bottom: 16px; padding-bottom: 14px;
  }
  .stats-tab {
    background: var(--surface); border: 1px solid var(--border); cursor: pointer;
    white-space: nowrap; font-family: 'Oswald', sans-serif; font-weight: 600;
    font-size: 12px; color: var(--ink-muted); padding: 8px 12px; border-radius: 999px;
    flex-shrink: 0;
  }
  .stats-tab.active { background: var(--pitch); color: #fff; border-color: var(--pitch); }
  .stats-subtitle {
    font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 13px;
    color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.5px;
    margin: 20px 0 8px;
  }
  .week-list {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    overflow: hidden;
  }
  .week-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px;
  }
  .week-row:not(:last-child) { border-bottom: 1px solid var(--border); }
  .week-row .user-link { font-size: 14px; }
  .rival-select {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 14px; color: var(--ink); margin-bottom: 10px;
    -webkit-appearance: none; appearance: none;
  }
  .rival-block {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .rival-user { font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 15px; margin: 0 0 10px; color: var(--ink); }
  .rival-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .rival-col-title {
    display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--ink-muted); margin-bottom: 6px; font-family: 'JetBrains Mono', monospace;
  }
  .rival-item {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 4px 0; color: var(--ink);
  }
  .rival-item strong { font-family: 'JetBrains Mono', monospace; color: var(--gold-text); background: var(--gold-bg); padding: 1px 7px; border-radius: 999px; font-size: 12px; }
  .rival-item.rival-empty { color: var(--ink-muted); }

  .stats-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 4px 16px;
  }
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; font-size: 14px; color: var(--ink);
  }
  .stat-row:not(:last-child) { border-bottom: 1px solid var(--border); }
  .stat-row strong { font-family: 'JetBrains Mono', monospace; color: var(--pitch); }

  .stats-table {
    width: 100%; border-collapse: collapse; background: var(--surface);
    border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
  }
  .stats-table th, .stats-table td { padding: 10px 14px; text-align: left; font-size: 13px; }
  .stats-table thead th {
    background: var(--bg); color: var(--ink-muted); font-size: 11px;
    text-transform: uppercase; border-bottom: 1px solid var(--border);
  }
  .stats-table tbody tr:not(:last-child) td { border-bottom: 1px solid var(--border); }
  .stats-table td:not(:first-child) { font-family: 'JetBrains Mono', monospace; color: var(--pitch); font-weight: 600; }

  .error-box {
    background: var(--rose-bg); color: var(--rose-text); border-radius: 12px;
    padding: 20px; max-width: 500px; margin: 40px auto; font-size: 14px;
  }
  .loading { text-align: center; color: var(--ink-muted); padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>

<div class="masthead">
  <div class="masthead-left">
    <img src="icon-192.png" alt="" class="app-logo" />
    <div>
      <div class="title-row">
        <h1 class="font-display">MUVINS BIWENGER</h1>
        <button class="info-btn" onclick="toggleInfoModal()" aria-label="Informacion">i</button>
      </div>
      <p id="last-updated"></p>
    </div>
  </div>
  <button class="stats-btn" onclick="openStats()" aria-label="Estadisticas">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="20" x2="18" y2="10"></line>
      <line x1="12" y1="20" x2="12" y2="4"></line>
      <line x1="6" y1="20" x2="6" y2="14"></line>
    </svg>
  </button>
</div>

<div id="info-modal" class="modal-backdrop" style="display:none;" onclick="closeInfoIfBackdrop(event)">
  <div class="modal-box">
    <p>Compras y clausulas por semana. Pulsa un manager para ver su detalle.</p>
    <button class="modal-close" onclick="toggleInfoModal()">Cerrar</button>
  </div>
</div>

<div id="ticker-wrap" class="ticker-wrap" style="display:none;">
  <div class="ticker-track" id="ticker-track"></div>
</div>

<div class="app-root" id="app-root">
  <div id="pull-indicator" class="pull-indicator"></div>
  <div id="app-content">
    <div class="loading">Cargando datos del mercado...</div>
  </div>
</div>

<div class="nav-wrap" id="nav-wrap" style="display:none;"></div>

<script>
// ============================================================
// CONFIGURACION: pon aqui el ID de tu Google Sheet
// ============================================================
const SHEET_ID = "1ir6uoalP7nLft8QX9776SuXW1yqGVw_CaUchFMLjdXc";

let USERS = [];
let SUMMARY_ROWS = [];
let USER_DATA = {}; // { nombre: filas[] }
let selectedUser = null;

function sheetCsvUrl(sheetName) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
}

async function fetchCsv(sheetName) {
  const res = await fetch(sheetCsvUrl(sheetName));
  const text = await res.text();
  if (!res.ok || text.trim().toLowerCase().startsWith("<")) {
    throw new Error(`No se pudo leer la pestana "${sheetName}". Comprueba que la hoja esta compartida como "Cualquiera con el enlace puede ver".`);
  }
  return Papa.parse(text, { header: true, skipEmptyLines: true });
}

function typeBadgeHtml(tipo) {
  const map = {
    Compra: { bg: "var(--green-bg)", text: "var(--green-text)", label: "Compra" },
    Venta: { bg: "var(--rose-bg)", text: "var(--rose-text)", label: "Venta" },
    Clausula: { bg: "var(--gold-bg)", text: "var(--gold-text)", label: "Clausula" },
  };
  const conf = map[tipo] || { bg: "#EEE", text: "#555", label: tipo || "-" };
  return `<span class="badge" style="background:${conf.bg};color:${conf.text}">${conf.label}</span>`;
}

function toggleInfoModal() {
  const modal = document.getElementById("info-modal");
  modal.style.display = modal.style.display === "none" ? "flex" : "none";
}
function closeInfoIfBackdrop(e) {
  if (e.target.id === "info-modal") toggleInfoModal();
}

async function loadAll() {
  const root = document.getElementById("app-content");
  root.innerHTML = '<div class="loading">Cargando datos del mercado...</div>';
  document.getElementById("ticker-wrap").style.display = "none";

  try {
    const summary = await fetchCsv("Resumen");
    const fields = summary.meta.fields || [];
    USERS = fields.filter(f => {
      if (!f) return false;
      const clean = f.trim();
      if (clean === "" || clean === "Semana") return false;
      if (/^_+\d*$/.test(clean)) return false; // columnas fantasma tipo "_1", "_22"
      if (/^column\s*\d*$/i.test(clean)) return false; // por si acaso, otra variante
      return true;
    });
    SUMMARY_ROWS = summary.data;

    USER_DATA = {};
    await Promise.all(USERS.map(async (name) => {
      try {
        const parsed = await fetchCsv(name);
        USER_DATA[name] = parsed.data;
      } catch (e) {
        USER_DATA[name] = [];
      }
    }));

    document.getElementById("last-updated").textContent =
      "Actualizado " + new Date().toLocaleTimeString("es-ES");

    renderTicker();
    renderNav(selectedUser || "__resumen__");
    if (selectedUser) {
      renderDossier(selectedUser);
    } else {
      renderSummary();
    }
  } catch (e) {
    root.innerHTML = `<div class="error-box"><b>No se pudieron cargar los datos</b><br>${e.message}</div>`;
  }
}

function renderNav(activeKey) {
  const nav = document.getElementById("nav-wrap");
  if (USERS.length === 0) { nav.style.display = "none"; return; }
  nav.style.display = "flex";
  let html = `<button class="nav-tab nav-tab-resumen ${activeKey === "__resumen__" ? "active" : ""}" onclick="renderSummary()">Resumen</button>`;
  USERS.forEach(u => {
    html += `<button class="nav-tab ${activeKey === u ? "active" : ""}" onclick="renderDossier('${u.replace(/'/g, "\\'")}')">${u}</button>`;
  });
  nav.innerHTML = html;
}

function renderTicker() {
  const all = [];
  Object.entries(USER_DATA).forEach(([name, rows]) => {
    rows.forEach(r => { if (r && r.Fecha) all.push({ ...r, usuario: name }); });
  });
  all.sort((a, b) => (b.Fecha || "").localeCompare(a.Fecha || ""));
  const ticker = all.slice(0, 12);

  const wrap = document.getElementById("ticker-wrap");
  const track = document.getElementById("ticker-track");
  if (ticker.length === 0) { wrap.style.display = "none"; return; }
  wrap.style.display = "block";

  const itemHtml = (t) => {
    const accion = t.Tipo === "Venta"
      ? "vendio a"
      : (t.Vendedor === "Mercado" ? "compro al mercado" : `compro a ${t.Vendedor}`);
    return `<span class="ticker-item"><b>${t.usuario}</b><span>${accion}</span><strong>${t.Jugador}</strong></span>`;
  };
  track.innerHTML = [...ticker, ...ticker].map(itemHtml).join("");
}

let summarySelectedWeek = null;

function buildWeekDetail(weekLabel) {
  const row = SUMMARY_ROWS.find(r => r.Semana === weekLabel);
  if (!row) return `<p class="hint">Sin datos para esta semana.</p>`;

  const entries = USERS.map(u => [u, Number(row[u] || 0)]);
  entries.sort((a, b) => b[1] - a[1]);

  const items = entries.map(([u, val]) => {
    let style = "color:var(--border)";
    if (val > 3) style = "background:var(--rose);color:#fff";
    else if (val > 0) style = "background:var(--pitch-light);color:#fff";
    return `
      <div class="week-row">
        <button class="user-link" onclick="renderDossier('${u.replace(/'/g, "\\'")}')">${u}</button>
        <span class="count-pill" style="${style}">${val}</span>
      </div>`;
  }).join("");

  return `<div class="week-list">${items}</div>`;
}

function onSummaryWeekChange(w) {
  summarySelectedWeek = w;
  document.getElementById("week-detail").innerHTML = buildWeekDetail(w);
}

function renderSummary() {
  selectedUser = null;
  renderNav("__resumen__");
  const root = document.getElementById("app-content");

  if (SUMMARY_ROWS.length === 0) {
    root.innerHTML = `<div class="container"><p class="hint">Todavia no hay movimientos registrados.</p></div>`;
    return;
  }

  const weeks = SUMMARY_ROWS.map(r => r.Semana);
  if (!summarySelectedWeek || !weeks.includes(summarySelectedWeek)) {
    summarySelectedWeek = weeks[0];
  }

  const options = weeks.map(w =>
    `<option value="${w}" ${w === summarySelectedWeek ? "selected" : ""}>${w}</option>`
  ).join("");

  root.innerHTML = `
    <div class="container">
      <select class="rival-select" onchange="onSummaryWeekChange(this.value)">${options}</select>
      <div id="week-detail">${buildWeekDetail(summarySelectedWeek)}</div>
    </div>
  `;
}

function renderDossier(username) {
  selectedUser = username;
  renderNav(username);
  const rows = (USER_DATA[username] || []).slice()
    .sort((a, b) => (b.Fecha || "").localeCompare(a.Fecha || ""));

  const root = document.getElementById("app-content");
  let html = `<div class="container">`;
  html += `<h2 class="font-display dossier-title">${username}</h2>`;
  html += `<p class="dossier-sub">${rows.length} movimiento${rows.length === 1 ? "" : "s"} registrado${rows.length === 1 ? "" : "s"}</p>`;

  if (rows.length === 0) {
    html += `<div class="card" style="justify-content:center;color:var(--ink-muted)">Sin movimientos todavia.</div>`;
  } else {
    rows.forEach(r => {
      const vendorLabel = r.Vendedor === "Mercado" ? "Mercado libre" : `Rival: ${r.Vendedor}`;
      html += `
        <div class="card">
          <div class="card-left">
            <div class="card-date">${r.Fecha}</div>
            <div>
              <p class="card-player">${r.Jugador}</p>
              <p class="card-vendor">${vendorLabel}</p>
            </div>
          </div>
          ${typeBadgeHtml(r.Tipo)}
        </div>`;
    });
  }
  html += `</div>`;
  root.innerHTML = html;
}

// ---------------------------------------------------------------------------
// Estadisticas
// ---------------------------------------------------------------------------
let statsTab = "total";

function allRows() {
  const rows = [];
  Object.entries(USER_DATA).forEach(([usuario, data]) => {
    (data || []).forEach(r => { if (r && r.Fecha) rows.push({ ...r, usuario }); });
  });
  return rows;
}

function openStats() {
  selectedUser = null;
  renderNav("__stats__");
  renderStats();
}

function statsTabButton(key, label) {
  const active = statsTab === key ? "active" : "";
  return `<button class="stats-tab ${active}" onclick="setStatsTab('${key}')">${label}</button>`;
}

function setStatsTab(key) {
  statsTab = key;
  renderStats();
}

function renderStats() {
  const root = document.getElementById("app-content");
  const rows = allRows();

  let body = "";
  if (statsTab === "total") body = renderStatsTotal(rows);
  else if (statsTab === "movimientos") body = renderStatsMovimientos(rows);
  else if (statsTab === "clausulas") body = renderStatsClausulas(rows);
  else if (statsTab === "patinazos") body = renderStatsPatinazos(rows);
  else if (statsTab === "inactividad") body = renderStatsInactividad(rows);

  root.innerHTML = `
    <div class="container">
      <h2 class="font-display dossier-title">Estadisticas</h2>
      <div class="stats-tabs">
        ${statsTabButton("total", "Total")}
        ${statsTabButton("movimientos", "Movimientos")}
        ${statsTabButton("clausulas", "Clausulas")}
        ${statsTabButton("patinazos", "Patinazos")}
        ${statsTabButton("inactividad", "Inactividad")}
      </div>
      ${body}
    </div>
  `;
}

function statRow(label, value) {
  return `<div class="stat-row"><span>${label}</span><strong>${value}</strong></div>`;
}

function rankingTable(headers, dataRows) {
  let html = `<table class="stats-table"><thead><tr>`;
  headers.forEach(h => { html += `<th>${h}</th>`; });
  html += `</tr></thead><tbody>`;
  dataRows.forEach(cols => {
    html += `<tr>` + cols.map(c => `<td>${c}</td>`).join("") + `</tr>`;
  });
  html += `</tbody></table>`;
  return html;
}

function renderStatsTotal(rows) {
  const total = rows.length;
  const compras = rows.filter(r => r.Tipo === "Compra").length;
  const ventas = rows.filter(r => r.Tipo === "Venta").length;
  const clausulas = rows.filter(r => r.Tipo === "Clausula compra").length; // cada clausula genera 2 filas, contamos 1 vez
  return `
    <div class="stats-card">
      ${statRow("Movimientos totales", total)}
      ${statRow("Compras al mercado", compras)}
      ${statRow("Ventas al mercado", ventas)}
      ${statRow("Clausulazos", clausulas)}
    </div>
  `;
}

function renderStatsMovimientos(rows) {
  const compras = {};
  const ventas = {};
  USERS.forEach(u => { compras[u] = 0; ventas[u] = 0; });
  rows.forEach(r => {
    if (r.Tipo === "Compra") compras[r.usuario] = (compras[r.usuario] || 0) + 1;
    if (r.Tipo === "Venta") ventas[r.usuario] = (ventas[r.usuario] || 0) + 1;
  });
  const sorted = USERS.slice().sort((a, b) => (compras[b] || 0) - (compras[a] || 0));
  return rankingTable(
    ["Usuario", "Compras", "Ventas"],
    sorted.map(u => [u, compras[u] || 0, ventas[u] || 0])
  );
}

let CLAUSULA_CAZADOR = {};
let CLAUSULA_CLAUSULADO = {};
let CLAUSULA_PAID_TO = {};
let CLAUSULA_PAID_BY = {};
let clausulaSelectedUser = null;

function fullRivalList(map) {
  return Object.entries(map || {}).sort((a, b) => b[1] - a[1]);
}

function rivalColumn(title, list) {
  if (list.length === 0) {
    return `<div class="rival-col"><span class="rival-col-title">${title}</span><div class="rival-item rival-empty">-</div></div>`;
  }
  const items = list.map(([nombre, veces]) =>
    `<div class="rival-item"><span>${nombre}</span><strong>${veces}</strong></div>`
  ).join("");
  return `<div class="rival-col"><span class="rival-col-title">${title}</span>${items}</div>`;
}

function buildUserClausulaBlock(u) {
  const cazador = CLAUSULA_CAZADOR[u] || 0;
  const cazado = CLAUSULA_CLAUSULADO[u] || 0;
  return `
    <p class="stats-subtitle">Jachazos al paso</p>
    <div class="stats-card" style="margin-bottom:16px;">
      ${statRow("Cazador", cazador)}
      ${statRow("Cazado", cazado)}
    </div>
    <p class="stats-subtitle">Francotiradores</p>
    <div class="rival-block">
      <div class="rival-cols">
        ${rivalColumn("Vistima", fullRivalList(CLAUSULA_PAID_TO[u]))}
        ${rivalColumn("Verdugo", fullRivalList(CLAUSULA_PAID_BY[u]))}
      </div>
    </div>
  `;
}

function onClausulaUserChange(u) {
  clausulaSelectedUser = u;
  document.getElementById("rival-detail").innerHTML = buildUserClausulaBlock(u);
}

function renderStatsClausulas(rows) {
  const cazador = {};
  const clausulado = {};
  USERS.forEach(u => { cazador[u] = 0; clausulado[u] = 0; });
  rows.forEach(r => {
    if (r.Tipo === "Clausula compra") cazador[r.usuario] = (cazador[r.usuario] || 0) + 1;
    if (r.Tipo === "Clausula venta") clausulado[r.usuario] = (clausulado[r.usuario] || 0) + 1;
  });
  CLAUSULA_CAZADOR = cazador;
  CLAUSULA_CLAUSULADO = clausulado;

  const paidTo = {};
  const paidBy = {};
  USERS.forEach(u => { paidTo[u] = {}; paidBy[u] = {}; });
  rows.forEach(r => {
    if (r.Tipo === "Clausula compra") {
      paidTo[r.usuario][r.Vendedor] = (paidTo[r.usuario][r.Vendedor] || 0) + 1;
      if (paidBy[r.Vendedor]) paidBy[r.Vendedor][r.usuario] = (paidBy[r.Vendedor][r.usuario] || 0) + 1;
    }
  });
  CLAUSULA_PAID_TO = paidTo;
  CLAUSULA_PAID_BY = paidBy;

  const sorted = USERS.slice().sort((a, b) => (cazador[b] || 0) - (cazador[a] || 0));
  if (!clausulaSelectedUser || !sorted.includes(clausulaSelectedUser)) {
    clausulaSelectedUser = sorted[0] || null;
  }

  if (sorted.length === 0) {
    return `<p class="hint">Todavia no hay usuarios registrados.</p>`;
  }

  const options = sorted.map(u =>
    `<option value="${u}" ${u === clausulaSelectedUser ? "selected" : ""}>${u}</option>`
  ).join("");

  return `
    <select class="rival-select" onchange="onClausulaUserChange(this.value)">${options}</select>
    <div id="rival-detail">${buildUserClausulaBlock(clausulaSelectedUser)}</div>
  `;
}

function weeklyAcquisitionCounts() {
  // { usuario: { semana: n } }
  const counts = {};
  USERS.forEach(u => { counts[u] = {}; });
  Object.entries(USER_DATA).forEach(([usuario, data]) => {
    (data || []).forEach(r => {
      if (r.Tipo === "Compra" || r.Tipo === "Clausula compra") {
        counts[usuario][r.Semana] = (counts[usuario][r.Semana] || 0) + 1;
      }
    });
  });
  return counts;
}

function renderStatsPatinazos(rows) {
  const weekly = weeklyAcquisitionCounts();
  const patinazos = {};
  USERS.forEach(u => {
    patinazos[u] = Object.values(weekly[u] || {}).filter(n => n > 3).length;
  });
  const sorted = USERS.slice().sort((a, b) => (patinazos[b] || 0) - (patinazos[a] || 0));
  return rankingTable(
    ["Usuario", "Semanas con mas de 3 fichajes"],
    sorted.map(u => [u, patinazos[u] || 0])
  );
}

function renderStatsInactividad(rows) {
  const lastSeen = {};
  Object.entries(USER_DATA).forEach(([usuario, data]) => {
    (data || []).forEach(r => {
      if (!r.Fecha) return;
      if (!lastSeen[usuario] || r.Fecha > lastSeen[usuario]) lastSeen[usuario] = r.Fecha;
    });
  });
  const now = new Date();
  const entries = USERS.map(u => {
    if (!lastSeen[u]) {
      return { usuario: u, days: -1, label: "Sin movimientos registrados" };
    }
    const lastDate = new Date(lastSeen[u].replace(" ", "T"));
    const days = Math.floor((now - lastDate) / (1000 * 60 * 60 * 24));
    return { usuario: u, days, label: `${days} dia${days === 1 ? "" : "s"} sin moverse` };
  });
  entries.sort((a, b) => b.days - a.days);
  return rankingTable(
    ["Usuario", "Inactividad"],
    entries.map(e => [e.usuario, e.label])
  );
}


(function setupPullToRefresh() {
  const appRoot = document.getElementById("app-root");
  const indicator = document.getElementById("pull-indicator");
  const THRESHOLD = 70;
  const MAX_PULL = 95;
  let startY = null;
  let pulling = false;
  let refreshing = false;

  appRoot.addEventListener("touchstart", (e) => {
    if (refreshing) return;
    if (appRoot.scrollTop <= 0) {
      startY = e.touches[0].clientY;
      pulling = true;
    } else {
      startY = null;
      pulling = false;
    }
  }, { passive: true });

  appRoot.addEventListener("touchmove", (e) => {
    if (!pulling || startY === null || refreshing) return;
    const delta = e.touches[0].clientY - startY;
    if (delta > 0 && appRoot.scrollTop <= 0) {
      e.preventDefault();
      const capped = Math.min(delta * 0.5, MAX_PULL);
      indicator.style.height = capped + "px";
      indicator.textContent = capped >= THRESHOLD
        ? "\u2191 Suelta para actualizar"
        : "\u2193 Desliza hacia abajo para actualizar";
    }
  }, { passive: false });

  appRoot.addEventListener("touchend", () => {
    if (!pulling) return;
    const currentHeight = parseFloat(indicator.style.height) || 0;
    if (currentHeight >= THRESHOLD && !refreshing) {
      refreshing = true;
      indicator.textContent = "Actualizando...";
      indicator.style.height = "50px";
      loadAll().finally(() => {
        indicator.style.height = "0px";
        refreshing = false;
      });
    } else {
      indicator.style.height = "0px";
    }
    pulling = false;
    startY = null;
  });
})();

loadAll();
</script>
